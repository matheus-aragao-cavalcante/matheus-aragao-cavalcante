<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-label="Animated BI dashboard - Operations Performance">
  <title>Operations Performance Dashboard (animated illustration)</title>
  <defs>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#F2C811" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="progG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CD7F32"/>
      <stop offset="0.5" stop-color="#C0C0C0"/>
      <stop offset="1" stop-color="#F2C811"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { fill: #161B22; stroke: #30363D; }
    .lbl { font-size: 10.5px; fill: #8B949E; font-weight: 600; letter-spacing: .08em; }
    .val { font-size: 30px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #8B949E; }
    .ttl { font-size: 12.5px; fill: #E6EDF3; font-weight: 600; }
    .grid { stroke: #21262D; stroke-dasharray: 3 4; }
    .axis { stroke: #30363D; }

    .pop { opacity: 0; animation: pop .8s ease-out forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .spark { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 2.2s ease-out .4s forwards; }
    .line  { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
             stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2.6s ease-out .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .area { opacity: 0; animation: fade 1s ease-out 2.6s forwards; }
    @keyframes fade { to { opacity: 1; } }

    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 9s ease-in-out infinite both; }
    @keyframes grow { 0% { transform: scaleY(0); } 12% { transform: scaleY(1); } 88% { transform: scaleY(1); } 100% { transform: scaleY(0); } }

    .tip { animation: tip 9s ease-in-out infinite; }
    @keyframes tip { 0%, 20% { opacity: 0; } 26%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }

    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }

    .flow { stroke-dasharray: 4 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }

    .prog { transform-box: fill-box; transform-origin: 0 50%; animation: prog 6s ease-in-out infinite; }
    @keyframes prog { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }

    .done    { animation: done 6s infinite; }
    @keyframes done { 0%, 58% { opacity: 0; } 62%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .running { animation: running 6s infinite; }
    @keyframes running { 0%, 58% { opacity: 1; } 62%, 96% { opacity: 0; } 100% { opacity: 1; } }

    .n0 { animation: n0 6s infinite; } @keyframes n0 { 0% { opacity: .35; } 4%, 94% { opacity: 1; } 100% { opacity: .35; } }
    .n1 { animation: n1 6s infinite; } @keyframes n1 { 0%, 14% { opacity: .35; } 18%, 94% { opacity: 1; } 100% { opacity: .35; } }
    .n2 { animation: n2 6s infinite; } @keyframes n2 { 0%, 28% { opacity: .35; } 32%, 94% { opacity: 1; } 100% { opacity: .35; } }
    .n3 { animation: n3 6s infinite; } @keyframes n3 { 0%, 42% { opacity: .35; } 46%, 94% { opacity: 1; } 100% { opacity: .35; } }
    .n4 { animation: n4 6s infinite; } @keyframes n4 { 0%, 56% { opacity: .35; } 60%, 94% { opacity: 1; } 100% { opacity: .35; } }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="959" height="565" rx="14" fill="#0D1117" stroke="#30363D"/>

  <!-- ================= HEADER ================= -->
  <rect x="24" y="32" width="6" height="12" rx="1" fill="#F2C811" opacity=".55"/>
  <rect x="33" y="26" width="6" height="18" rx="1" fill="#F2C811" opacity=".8"/>
  <rect x="42" y="20" width="6" height="24" rx="1" fill="#F2C811"/>
  <text x="58" y="36" font-size="18" font-weight="700" fill="#E6EDF3">Operations Performance Dashboard</text>
  <text x="58" y="54" class="sub">Microsoft Fabric Lakehouse · Power BI Semantic Model · sample view</text>

  <rect x="596" y="20" width="84" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
  <text x="638" y="37" font-size="11" fill="#C9D1D9" text-anchor="middle">FY 2026 ▾</text>
  <rect x="688" y="20" width="108" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
  <text x="742" y="37" font-size="11" fill="#C9D1D9" text-anchor="middle">All Departments ▾</text>
  <rect x="804" y="20" width="132" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
  <circle cx="822" cy="33" r="4" fill="#3FB950" class="ring"/>
  <circle cx="822" cy="33" r="4" fill="#3FB950" class="pulse"/>
  <text x="834" y="37" font-size="11" fill="#C9D1D9">LIVE · Refreshed</text>

  <line x1="24" y1="68" x2="936" y2="68" stroke="#21262D"/>

  <!-- ================= KPI CARDS ================= -->
  <!-- KPI 1 -->
  <rect x="24" y="80" width="216" height="92" rx="10" class="card"/>
  <text x="40" y="104" class="lbl">REPORTING EFFORT</text>
  <text x="40" y="142" class="val pop" fill="#3FB950" style="animation-delay:.2s">−80%</text>
  <text x="40" y="160" class="sub">vs. manual baseline</text>
  <polyline class="spark" stroke="#3FB950" points="154,120 166,122 178,128 190,134 202,140 214,143 224,146"/>
  <circle cx="224" cy="146" r="3" fill="#3FB950" class="pop" style="animation-delay:2.4s"/>

  <!-- KPI 2 -->
  <rect x="256" y="80" width="216" height="92" rx="10" class="card"/>
  <text x="272" y="104" class="lbl">DATA SOURCES</text>
  <text x="272" y="142" class="val pop" fill="#F2C811" style="animation-delay:.35s">10+</text>
  <text x="272" y="160" class="sub">unified in the Lakehouse</text>
  <polyline class="spark" stroke="#F2C811" points="386,146 398,142 410,136 422,134 434,126 446,122 456,117"/>
  <circle cx="456" cy="117" r="3" fill="#F2C811" class="pop" style="animation-delay:2.4s"/>

  <!-- KPI 3 -->
  <rect x="488" y="80" width="216" height="92" rx="10" class="card"/>
  <text x="504" y="104" class="lbl">STAKEHOLDER GROUPS</text>
  <text x="504" y="142" class="val pop" fill="#E6EDF3" style="animation-delay:.5s">14</text>
  <text x="504" y="160" class="sub">served by one platform</text>
  <polyline class="spark" stroke="#58A6FF" points="618,146 630,146 642,136 654,136 666,127 678,122 688,117"/>
  <circle cx="688" cy="117" r="3" fill="#58A6FF" class="pop" style="animation-delay:2.4s"/>

  <!-- KPI 4 -->
  <rect x="720" y="80" width="216" height="92" rx="10" class="card"/>
  <text x="736" y="104" class="lbl">MONITORED INITIATIVES</text>
  <text x="736" y="142" class="val pop" fill="#E6EDF3" style="animation-delay:.65s">23</text>
  <text x="736" y="160" class="sub">across 5 departments</text>
  <polyline class="spark" stroke="#A371F7" points="850,146 862,138 874,140 886,130 898,127 910,120 920,117"/>
  <circle cx="920" cy="117" r="3" fill="#A371F7" class="pop" style="animation-delay:2.4s"/>

  <!-- ================= BAR CHART ================= -->
  <rect x="24" y="186" width="576" height="180" rx="10" class="card"/>
  <text x="40" y="210" class="ttl">Monthly Pipeline Throughput · M rows</text>
  <line x1="56" y1="236" x2="584" y2="236" class="grid"/>
  <line x1="56" y1="272" x2="584" y2="272" class="grid"/>
  <line x1="56" y1="309" x2="584" y2="309" class="grid"/>
  <line x1="56" y1="346" x2="584" y2="346" class="axis"/>

  <rect class="bar" x="64"  y="308" width="28" height="38"  rx="3" fill="url(#barG)" style="animation-delay:0s"/>
  <rect class="bar" x="108" y="300" width="28" height="46"  rx="3" fill="url(#barG)" style="animation-delay:.08s"/>
  <rect class="bar" x="152" y="304" width="28" height="42"  rx="3" fill="url(#barG)" style="animation-delay:.16s"/>
  <rect class="bar" x="196" y="291" width="28" height="55"  rx="3" fill="url(#barG)" style="animation-delay:.24s"/>
  <rect class="bar" x="240" y="285" width="28" height="61"  rx="3" fill="url(#barG)" style="animation-delay:.32s"/>
  <rect class="bar" x="284" y="288" width="28" height="58"  rx="3" fill="url(#barG)" style="animation-delay:.40s"/>
  <rect class="bar" x="328" y="276" width="28" height="70"  rx="3" fill="url(#barG)" style="animation-delay:.48s"/>
  <rect class="bar" x="372" y="270" width="28" height="76"  rx="3" fill="url(#barG)" style="animation-delay:.56s"/>
  <rect class="bar" x="416" y="273" width="28" height="73"  rx="3" fill="url(#barG)" style="animation-delay:.64s"/>
  <rect class="bar" x="460" y="258" width="28" height="88"  rx="3" fill="url(#barG)" style="animation-delay:.72s"/>
  <rect class="bar" x="504" y="249" width="28" height="97"  rx="3" fill="url(#barG)" style="animation-delay:.80s"/>
  <rect class="bar" x="548" y="238" width="28" height="108" rx="3" fill="#F2C811" filter="url(#glow)" style="animation-delay:.88s"/>

  <g font-size="10" fill="#8B949E" text-anchor="middle">
    <text x="78" y="360">Oct</text><text x="122" y="360">Nov</text><text x="166" y="360">Dec</text>
    <text x="210" y="360">Jan</text><text x="254" y="360">Feb</text><text x="298" y="360">Mar</text>
    <text x="342" y="360">Apr</text><text x="386" y="360">May</text><text x="430" y="360">Jun</text>
    <text x="474" y="360">Jul</text><text x="518" y="360">Aug</text><text x="562" y="360">Sep</text>
  </g>

  <g class="tip">
    <rect x="510" y="212" width="76" height="20" rx="4" fill="#F2C811"/>
    <path d="M544,232 L548,236 L552,232 Z" fill="#F2C811"/>
    <text x="548" y="226" font-size="10.5" font-weight="700" fill="#0D1117" text-anchor="middle">108M ▲ 12%</text>
  </g>

  <!-- ================= DONUT ================= -->
  <rect x="616" y="186" width="320" height="180" rx="10" class="card"/>
  <text x="632" y="210" class="ttl">Lakehouse Storage by Layer</text>

  <g transform="rotate(-90 700 292)">
    <circle cx="700" cy="292" r="50" fill="none" stroke="#21262D" stroke-width="16"/>
    <circle cx="700" cy="292" r="50" fill="none" stroke="#CD7F32" stroke-width="16" stroke-dasharray="138.4 314.16" stroke-dashoffset="0">
      <animate attributeName="stroke-dasharray" values="0 314.16;0 314.16;138.4 314.16" keyTimes="0;0.2;1" dur="1.4s" fill="freeze"/>
    </circle>
    <circle cx="700" cy="292" r="50" fill="none" stroke="#C0C0C0" stroke-width="16" stroke-dasharray="100.7 314.16" stroke-dashoffset="-141.4">
      <animate attributeName="stroke-dasharray" values="0 314.16;0 314.16;100.7 314.16" keyTimes="0;0.45;1" dur="1.8s" fill="freeze"/>
    </circle>
    <circle cx="700" cy="292" r="50" fill="none" stroke="#F2C811" stroke-width="16" stroke-dasharray="66.1 314.16" stroke-dashoffset="-245.1">
      <animate attributeName="stroke-dasharray" values="0 314.16;0 314.16;66.1 314.16" keyTimes="0;0.6;1" dur="2.2s" fill="freeze"/>
    </circle>
  </g>
  <text x="700" y="296" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="middle">4.8 TB</text>
  <text x="700" y="312" class="sub" text-anchor="middle">stored</text>

  <rect x="782" y="250" width="10" height="10" rx="2" fill="#CD7F32"/>
  <text x="800" y="259" font-size="11" fill="#C9D1D9">Bronze</text>
  <text x="920" y="259" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="end">45%</text>
  <rect x="782" y="276" width="10" height="10" rx="2" fill="#C0C0C0"/>
  <text x="800" y="285" font-size="11" fill="#C9D1D9">Silver</text>
  <text x="920" y="285" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="end">33%</text>
  <rect x="782" y="302" width="10" height="10" rx="2" fill="#F2C811"/>
  <text x="800" y="311" font-size="11" fill="#C9D1D9">Gold</text>
  <text x="920" y="311" font-size="11" font-weight="700" fill="#E6EDF3" text-anchor="end">22%</text>
  <line x1="782" y1="326" x2="920" y2="326" stroke="#30363D"/>
  <text x="782" y="346" class="sub">Data quality score</text>
  <text x="920" y="346" font-size="13" font-weight="700" fill="#3FB950" text-anchor="end" class="pop" style="animation-delay:2.2s">99.2%</text>

  <!-- ================= LINE CHART ================= -->
  <rect x="24" y="382" width="456" height="158" rx="10" class="card"/>
  <text x="40" y="406" class="ttl">Manual Hours vs. Automated Workflows</text>
  <circle cx="340" cy="402" r="4" fill="#F85149"/>
  <text x="348" y="406" font-size="10.5" fill="#C9D1D9">Manual</text>
  <circle cx="398" cy="402" r="4" fill="#3FB950"/>
  <text x="406" y="406" font-size="10.5" fill="#C9D1D9">Automated</text>

  <line x1="56" y1="440" x2="464" y2="440" class="grid"/>
  <line x1="56" y1="468" x2="464" y2="468" class="grid"/>
  <line x1="56" y1="496" x2="464" y2="496" class="grid"/>
  <line x1="56" y1="516" x2="464" y2="516" class="axis"/>

  <path class="area" fill="url(#areaG)" d="M56,510 L101,506 L147,498 L192,484 L237,470 L283,456 L328,446 L373,438 L419,432 L464,428 L464,516 L56,516 Z"/>
  <path class="line" stroke="#F85149" d="M56,420 L101,424 L147,432 L192,446 L237,462 L283,476 L328,488 L373,496 L419,500 L464,502"/>
  <path class="line" stroke="#3FB950" d="M56,510 L101,506 L147,498 L192,484 L237,470 L283,456 L328,446 L373,438 L419,432 L464,428"/>
  <circle cx="464" cy="502" r="4" fill="#F85149" class="pop" style="animation-delay:3s"/>
  <circle cx="464" cy="428" r="4" fill="#3FB950" class="pop" style="animation-delay:3s"/>

  <!-- ================= PIPELINE ================= -->
  <rect x="496" y="382" width="440" height="158" rx="10" class="card"/>
  <text x="512" y="406" class="ttl">Lakehouse Pipeline · Last Run</text>
  <text x="920" y="406" font-size="11" font-weight="700" fill="#F2C811" text-anchor="end" class="running">● Running…</text>
  <text x="920" y="406" font-size="11" font-weight="700" fill="#3FB950" text-anchor="end" class="done">✓ Succeeded</text>

  <line x1="540" y1="446" x2="880" y2="446" stroke="#30363D" stroke-width="2" class="flow"/>

  <circle r="3.5" fill="#F2C811" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" begin="0s" path="M540,446 H880"/></circle>
  <circle r="3.5" fill="#F2C811" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" begin="-0.75s" path="M540,446 H880"/></circle>
  <circle r="3.5" fill="#F2C811" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" begin="-1.5s" path="M540,446 H880"/></circle>
  <circle r="3.5" fill="#F2C811" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" begin="-2.25s" path="M540,446 H880"/></circle>

  <g class="n0">
    <circle cx="540" cy="446" r="17" fill="#0D1117" stroke="#8B949E" stroke-width="2"/>
    <text x="540" y="450" font-size="10" font-weight="700" fill="#C9D1D9" text-anchor="middle">API</text>
    <text x="540" y="480" class="sub" text-anchor="middle">Sources</text>
  </g>
  <g class="n1">
    <circle cx="625" cy="446" r="17" fill="#0D1117" stroke="#CD7F32" stroke-width="2"/>
    <text x="625" y="450" font-size="11" font-weight="700" fill="#CD7F32" text-anchor="middle">B</text>
    <text x="625" y="480" class="sub" text-anchor="middle">Bronze</text>
  </g>
  <g class="n2">
    <circle cx="710" cy="446" r="17" fill="#0D1117" stroke="#C0C0C0" stroke-width="2"/>
    <text x="710" y="450" font-size="11" font-weight="700" fill="#C0C0C0" text-anchor="middle">S</text>
    <text x="710" y="480" class="sub" text-anchor="middle">Silver</text>
  </g>
  <g class="n3">
    <circle cx="795" cy="446" r="17" fill="#0D1117" stroke="#F2C811" stroke-width="2"/>
    <text x="795" y="450" font-size="11" font-weight="700" fill="#F2C811" text-anchor="middle">G</text>
    <text x="795" y="480" class="sub" text-anchor="middle">Gold</text>
  </g>
  <g class="n4">
    <circle cx="880" cy="446" r="17" fill="#F2C811" stroke="#F2C811" stroke-width="2" filter="url(#glow)"/>
    <text x="880" y="450" font-size="10" font-weight="700" fill="#0D1117" text-anchor="middle">BI</text>
    <text x="880" y="480" class="sub" text-anchor="middle">Power BI</text>
  </g>

  <rect x="512" y="494" width="408" height="6" rx="3" fill="#21262D"/>
  <rect x="512" y="494" width="408" height="6" rx="3" fill="url(#progG)" class="prog"/>
  <text x="512" y="522" class="sub">Run #1,284 · 10+ sources · 2.1M rows</text>
  <text x="920" y="522" class="sub" text-anchor="end">Duration 00:03:42</text>

  <!-- Footer note -->
  <text x="480" y="558" font-size="9.5" fill="#6E7681" text-anchor="middle">Animated illustration · KPI values reflect real project outcomes · chart data is illustrative</text>
</svg>
